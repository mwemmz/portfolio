<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Chimwemwe Siyingwa — Developer Portfolio</title>
  <meta name="description" content="Software developer building solutions that solve real problems. Third-year IS&T student, junior developer, and open source contributor.">
  <meta name="theme-color" content="#08090c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Lexend:wght@300;400;500&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #d4dae2;
      --mute: #8b949e;
      --soft: #6e7681;
      --band: #1b222c;
      --chip: #232b37;
      --bg: #08090c;
      --surface: #11151b;
      --border: #232a35;
      --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
      --sacc: #6d4aff;
    }

    html, body { height: 100%; }
    body {
      font-family: 'Lexend', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: var(--ink);
      background: var(--bg);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column; height: 100dvh;
    }

    /* ── VS Code shell ── */
    .titlebar { display: flex; align-items: stretch; height: 36px; flex: none; background: var(--bg); border-bottom: 1px solid var(--border); font-family: var(--mono); font-size: 12px; }
    .lights { display: flex; align-items: center; gap: 8px; padding: 0 14px; flex: none; }
    .lights i { width: 12px; height: 12px; border-radius: 50%; }
    .lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
    .tabs { display: flex; overflow-x: auto; scrollbar-width: none; min-width: 0; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { display: flex; align-items: center; gap: 8px; padding: 0 16px; color: var(--mute); border-right: 1px solid var(--border); white-space: nowrap; position: relative; transition: color .15s, background .15s; }
    .tab:hover { color: var(--ink); background: rgba(255, 255, 255, .03); }
    .tab.active { color: #fff; background: var(--surface); }
    .tab.active::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--sacc); }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .shell { display: flex; flex: 1; min-height: 0; }
    .side { width: 232px; flex: none; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; scrollbar-width: none; font-family: var(--mono); font-size: 12px; }
    .side::-webkit-scrollbar { display: none; }
    .side h2 { font-weight: 500; font-size: 11px; letter-spacing: .08em; color: var(--mute); padding: 12px 16px 8px; border-bottom: 1px solid var(--border); }
    .tree { padding: 8px 0; }
    .tree .fold { display: flex; align-items: center; gap: 6px; padding: 4px 12px; color: var(--ink); }
    .tree .fold svg { width: 12px; height: 12px; opacity: .7; flex: none; }
    .tree .file { display: flex; align-items: center; gap: 8px; width: 100%; padding: 4px 16px 4px 30px; color: var(--mute); text-align: left; transition: color .15s, background .15s; }
    .tree .file.in { padding-left: 46px; }
    .tree .file:hover { color: var(--ink); background: rgba(255, 255, 255, .03); }
    .tree .file[aria-current="true"] { color: #fff; background: rgba(255, 255, 255, .06); box-shadow: inset 2px 0 var(--sacc); }
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .crumb { flex: none; padding: 6px 16px; font-family: var(--mono); font-size: 11.5px; color: var(--mute); background: var(--surface); border-bottom: 1px solid var(--border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .crumb b { font-weight: 400; color: var(--ink); }
    .status { flex: none; height: 24px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 0; background: var(--surface); border-top: 1px solid var(--border); font-family: var(--mono); font-size: 11px; color: var(--mute); }
    .status span { display: inline-flex; align-items: center; gap: 6px; }
    .status .br { background: var(--sacc); color: #fff; height: 100%; padding: 0 12px; transition: background .5s; }
    .status .br svg { width: 12px; height: 12px; }
    .status .r { gap: 16px; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    a { color: inherit; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ── Stage & card (everything scales with --u = 1% of card width) ── */
    .stage { flex: 1; min-height: 0; container-type: size; display: grid; place-items: center; overflow: auto; background: radial-gradient(90% 80% at 50% 0%, #121720, var(--bg)); }
    .card {
      --w: min(1280px, 96cqw, calc((100cqh - 28px) * 1.5));
      --u: calc(var(--w) / 100);
      --acc: #6d4aff;
      position: relative;
      width: var(--w);
      height: calc(var(--w) / 1.5);
    }
    .cardbg {
      position: absolute; inset: 0;
      border-radius: calc(var(--u) * 5.6);
      background: linear-gradient(#181e27 58%, #10141b);
      box-shadow: 0 calc(var(--u) * 3.2) calc(var(--u) * 7) rgba(0, 0, 0, .55), 0 0 0 1px #262e3a;
      animation: pop .9s cubic-bezier(.2, .9, .25, 1) both;
    }
    @keyframes pop { from { opacity: 0; transform: translateY(calc(var(--u) * 2)) scale(.985); } }

    .blobwrap {
      position: absolute; left: 0; top: 0; width: 52%; height: 82%;
      border-radius: calc(var(--u) * 5.6) 0 0 0;
      overflow: hidden; z-index: 1;
    }
    .blobwrap svg { display: block; width: 100%; height: 100%; }

    .logo { position: absolute; left: calc(var(--u) * 10.6); top: calc(var(--u) * 6.8); width: calc(var(--u) * 2.1); z-index: 5; color: #fff; opacity: .9; }
    .logo svg { display: block; width: 100%; }
    .avatar {
      position: absolute; right: calc(var(--u) * 7.4); top: calc(var(--u) * 6.3);
      width: calc(var(--u) * 4); height: calc(var(--u) * 4); z-index: 5;
      border-radius: 50%; transition: transform .3s;
    }
    .avatar:hover { transform: scale(1.1) rotate(-6deg); }
    .avatar svg { display: block; width: 100%; height: 100%; }

    /* ── Headline on the blob ── */
    .headline {
      position: absolute; left: 11%; top: 21%; z-index: 2;
      font-family: 'Poppins', sans-serif; font-weight: 800;
      font-size: calc(var(--u) * 5); line-height: 1.07; letter-spacing: -.012em;
      color: #fff; text-shadow: 0 calc(var(--u) * .3) calc(var(--u) * 1.2) rgba(20, 10, 60, .14);
    }
    .headline .ln { display: block; overflow: hidden; width: calc(var(--u) * 36); padding-bottom: .16em; margin-bottom: -.16em; }
    .t, .t2 { display: inline-block; will-change: transform; }

    /* ── Floating objects ── */
    .fx { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
    .o {
      position: absolute;
      left: calc(var(--dx) * 1%); top: calc(var(--dy) * 1%);
      width: calc(var(--u) * var(--z)); aspect-ratio: 1;
      translate: -50% -50%;
    }
    .o svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .o .fl { width: 100%; height: 100%; animation: fl var(--fd, 6s) ease-in-out infinite alternate; }
    .o.static .fl { animation-duration: 8s; }
    @keyframes fl {
      from { transform: translateY(calc(var(--u) * -.7)) rotate(-3deg); }
      to   { transform: translateY(calc(var(--u) * .7)) rotate(3deg); }
    }

    /* ── Right panel ── */
    .panel {
      position: absolute; left: 53.5%; right: 0; top: 19%; bottom: 0; z-index: 4;
      display: flex; flex-direction: column; pointer-events: none;
    }
    .panel > * { pointer-events: auto; }
    .title {
      padding-left: calc(var(--u) * 4);
      font-weight: 300; font-size: calc(var(--u) * 3.15); line-height: 1.38; letter-spacing: -.005em;
    }
    .title .ln { display: block; overflow: hidden; padding-bottom: .12em; margin-bottom: -.12em; }
    .tag {
      padding-left: calc(var(--u) * 4); margin-top: calc(var(--u) * 1.2);
      min-height: calc(var(--u) * 2.4); font-size: calc(var(--u) * 1.35); color: var(--mute);
    }
    .thead {
      display: grid; grid-template-columns: 1fr calc(var(--u) * 9) calc(var(--u) * 6.6) calc(var(--u) * 5);
      padding: 0 calc(var(--u) * 3) 0 calc(var(--u) * 4); margin-top: calc(var(--u) * 3);
      font-size: calc(var(--u) * 1.05); letter-spacing: .14em; text-transform: uppercase; color: var(--mute);
    }
    .list {
      flex: 1; min-height: 0; list-style: none; margin-top: calc(var(--u) * 1.6);
      overflow-y: auto; scrollbar-width: none; overscroll-behavior: contain;
      padding-bottom: calc(var(--u) * 16);
      -webkit-mask-image: linear-gradient(#000 calc(100% - var(--u) * 17), transparent calc(100% - var(--u) * 5));
      mask-image: linear-gradient(#000 calc(100% - var(--u) * 17), transparent calc(100% - var(--u) * 5));
    }
    .list::-webkit-scrollbar { display: none; }
    .item:nth-child(odd) { background: linear-gradient(90deg, rgba(27, 34, 44, 0), var(--band) calc(var(--u) * 4.5)); }
    .row {
      display: grid; grid-template-columns: 1fr calc(var(--u) * 9) calc(var(--u) * 6.6) calc(var(--u) * 5);
      align-items: center; width: 100%; min-height: calc(var(--u) * 7.6);
      padding: calc(var(--u) * .9) calc(var(--u) * 3) calc(var(--u) * .9) calc(var(--u) * 4);
      text-align: left; text-decoration: none; color: inherit;
      font-size: calc(var(--u) * 1.7); line-height: 1.28;
    }
    .row .nm { overflow-wrap: anywhere; padding-right: calc(var(--u) * 1); }
    .row .mt { font-size: calc(var(--u) * 1.15); color: var(--mute); line-height: 1.3; overflow-wrap: anywhere; }
    .row .th { display: grid; place-items: center; }
    .row .th svg { width: calc(var(--u) * 4.6); height: calc(var(--u) * 4.6); display: block; transition: transform .45s cubic-bezier(.2, .9, .25, 1); }
    .row:hover .th svg { transform: translateY(calc(var(--u) * -.4)) rotate(-8deg) scale(1.08); }
    .row .pl { display: grid; place-items: center; justify-self: end; width: calc(var(--u) * 2.2); }
    .row .pl .ic { width: calc(var(--u) * 1.8); height: calc(var(--u) * 1.8); transition: transform .35s, color .2s; }
    .row:hover .pl .ic { color: var(--acc); }
    .item.open .pl .ic { transform: rotate(45deg); color: var(--acc); }
    .detail {
      max-height: 0; overflow: hidden; transition: max-height .5s cubic-bezier(.2, .8, .2, 1);
      padding: 0 calc(var(--u) * 3) 0 calc(var(--u) * 4);
      font-size: calc(var(--u) * 1.35); line-height: 1.6; color: var(--mute);
    }
    .detail > div { padding-bottom: calc(var(--u) * 1.6); }
    .lk {
      display: inline-flex; align-items: center; gap: .4em; margin: .9em .7em 0 0; padding: .5em 1.1em;
      border: 1px solid #2c3441; border-radius: 99px; background: #11151b; color: var(--ink);
      text-decoration: none; font-size: calc(var(--u) * 1.25); transition: border-color .2s, color .2s;
    }
    .lk:hover { border-color: var(--acc); color: var(--acc); }
    .lk .ic { width: 1.1em; height: 1.1em; }
    .chips { display: flex; flex-wrap: wrap; gap: .5em; margin-top: .3em; }
    .chips span { padding: .3em .9em; border-radius: 99px; background: #11151b; border: 1px solid #2c3441; color: var(--ink); font-size: .95em; }

    /* ── Bottom UI ── */
    .pill {
      position: absolute; left: 59%; translate: -50% 0; bottom: calc(var(--u) * 7.6); z-index: 6;
      display: flex; align-items: center; gap: calc(var(--u) * .4);
      padding: calc(var(--u) * .7) calc(var(--u) * .7) calc(var(--u) * .7) calc(var(--u) * 1.6);
      background: #1d242e; border-radius: 99px;
      box-shadow: 0 calc(var(--u) * 1.4) calc(var(--u) * 3.6) rgba(0, 0, 0, .5), 0 0 0 1px #2c3441;
    }
    .pill > button, .pill > a {
      display: grid; place-items: center; width: calc(var(--u) * 4.6); height: calc(var(--u) * 4.6);
      border-radius: 50%; color: #c3cad3; transition: background .2s, color .2s;
    }
    .pill > button:hover, .pill > a:hover { background: var(--chip); }
    .pill #mail { color: var(--acc); }
    .pill .sep { width: 1px; height: calc(var(--u) * 3.4); background: #2c3441; margin: 0 calc(var(--u) * .5) 0 calc(var(--u) * .3); }
    .pill .go {
      width: calc(var(--u) * 6.2); height: calc(var(--u) * 6.2); background: var(--acc); color: #fff;
      box-shadow: 0 calc(var(--u) * .6) calc(var(--u) * 1.4) rgba(20, 20, 40, .3); transition: transform .3s, background .2s;
    }
    .pill .go:hover { filter: brightness(1.12); transform: translateX(calc(var(--u) * .25)); }
    .ic { width: calc(var(--u) * 2.1); height: calc(var(--u) * 2.1); display: block; }

    .steps { position: absolute; left: calc(var(--u) * 5); bottom: calc(var(--u) * 4.9); z-index: 6; display: flex; align-items: center; gap: calc(var(--u) * .6); }
    .steps .cur, .menubtn {
      display: grid; place-items: center; width: calc(var(--u) * 6.2); height: calc(var(--u) * 6.2);
      background: var(--chip); border-radius: calc(var(--u) * 1.7); color: #d4dae2; transition: background .2s;
    }
    .steps .cur:hover, .menubtn:hover { background: #2d3643; }
    .steps .sm { display: grid; place-items: center; width: calc(var(--u) * 3); height: calc(var(--u) * 3); color: #98a1ad; opacity: .8; transition: opacity .2s; }
    .steps .sm:hover { opacity: 1; }
    .steps .sm .ic { width: calc(var(--u) * 1.8); height: calc(var(--u) * 1.8); }
    .steps .dash { width: calc(var(--u) * 1.9); height: 1px; background: #98a1ad; opacity: .55; }
    .menubtn { position: absolute; right: calc(var(--u) * 5); bottom: calc(var(--u) * 4.9); z-index: 6; }

    .menu {
      position: absolute; right: calc(var(--u) * 5); bottom: calc(var(--u) * 12); z-index: 8; min-width: calc(var(--u) * 24);
      padding: calc(var(--u) * .8); background: #1d242e; border: 1px solid #2c3441; border-radius: calc(var(--u) * 2.4);
      box-shadow: 0 calc(var(--u) * 1.6) calc(var(--u) * 4) rgba(0, 0, 0, .55); list-style: none;
    }
    .menu[hidden] { display: none; }
    .menu button {
      display: flex; align-items: center; gap: calc(var(--u) * 1.2); width: 100%; padding: calc(var(--u) * .9) calc(var(--u) * 1.2);
      border-radius: calc(var(--u) * 1.4); font-size: calc(var(--u) * 1.5); text-align: left; transition: background .2s;
    }
    .menu button:hover, .menu button[aria-current="true"] { background: var(--chip); }
    .menu .ic { width: calc(var(--u) * 2); height: calc(var(--u) * 2); color: var(--mute); }
    .menu small { margin-left: auto; color: var(--soft); font-size: .8em; }

    :focus-visible { outline: 2px solid var(--acc); outline-offset: 3px; border-radius: 10px; }
    noscript { position: fixed; inset: auto 16px 16px 16px; padding: 14px 16px; background: #1d242e; color: #d4dae2; border-radius: 14px; font-size: 14px; z-index: 20; }

    @media (prefers-reduced-motion: reduce) {
      .cardbg { animation: none; }
      .o .fl { animation: none; }
      .detail { transition: none; }
    }

    /* ── Phones & narrow windows ── */
    @media (max-width: 980px) {
      .side, .crumb { display: none; }
      .stage { place-items: start center; }
      .card { --w: calc(100cqw - 16px); --u: calc(var(--w) / 40); height: calc(100cqh - 16px); min-height: 560px; margin: 8px 0; }
      .cardbg { border-radius: calc(var(--u) * 3); }
      .blobwrap { width: 100%; height: 44%; border-radius: calc(var(--u) * 3) calc(var(--u) * 3) 0 0; }
      .logo { left: calc(var(--u) * 5); top: calc(var(--u) * 3.6); width: calc(var(--u) * 2.2); }
      .avatar { right: calc(var(--u) * 4.4); top: calc(var(--u) * 3); width: calc(var(--u) * 4); height: calc(var(--u) * 4); }
      .headline { left: calc(var(--u) * 5); top: 11.5%; font-size: calc(var(--u) * 4.1); }
      .headline .ln { width: calc(var(--u) * 30); }
      .o { left: calc(var(--mx) * 1%); top: calc(var(--my) * 1%); width: calc(var(--u) * var(--zm)); }
      .panel { left: 0; right: 0; top: 45.5%; }
      .title { padding-left: calc(var(--u) * 5); font-size: calc(var(--u) * 2.5); line-height: 1.3; }
      .title .ln { display: inline-block; margin-right: .28em; }
      .tag { display: none; }
      .thead { padding: 0 calc(var(--u) * 3) 0 calc(var(--u) * 5); margin-top: calc(var(--u) * 1.4); font-size: calc(var(--u) * .95); grid-template-columns: 1fr calc(var(--u) * 10) calc(var(--u) * 7) calc(var(--u) * 4); }
      .list { margin-top: calc(var(--u) * 1); padding-bottom: calc(var(--u) * 15); }
      .row { grid-template-columns: 1fr calc(var(--u) * 10) calc(var(--u) * 7) calc(var(--u) * 4); min-height: calc(var(--u) * 6.4); padding-left: calc(var(--u) * 5); font-size: calc(var(--u) * 1.6); }
      .row .mt { font-size: calc(var(--u) * 1.1); }
      .row .th svg { width: calc(var(--u) * 4); height: calc(var(--u) * 4); }
      .detail { padding-left: calc(var(--u) * 5); font-size: calc(var(--u) * 1.35); }
      .item:nth-child(odd) { background: linear-gradient(90deg, rgba(27, 34, 44, 0), var(--band) calc(var(--u) * 3)); }
      .pill { left: 50%; bottom: calc(var(--u) * 3.2); }
      .pill > button, .pill > a { width: calc(var(--u) * 4.4); height: calc(var(--u) * 4.4); }
      .pill .go { width: calc(var(--u) * 5.6); height: calc(var(--u) * 5.6); }
      .ic { width: calc(var(--u) * 2); height: calc(var(--u) * 2); }
      .steps { left: calc(var(--u) * 3.6); bottom: calc(var(--u) * 3.8); }
      .steps .sm, .steps .dash { display: none; }
      .steps .cur, .menubtn { width: calc(var(--u) * 4.8); height: calc(var(--u) * 4.8); border-radius: calc(var(--u) * 1.4); }
      .menubtn { right: calc(var(--u) * 3.6); bottom: calc(var(--u) * 3.8); }
      .menu { right: calc(var(--u) * 3.6); bottom: calc(var(--u) * 10); min-width: calc(var(--u) * 20); }
      .menu button { font-size: calc(var(--u) * 1.6); }
    }
  </style>
</head>
<body>
  <h1 class="sr">Chimwemwe Siyingwa — Developer Portfolio</h1>
  <p class="sr" id="live" aria-live="polite"></p>

  <header class="titlebar">
    <div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
    <nav class="tabs" id="tabs" aria-label="Open files"></nav>
  </header>
  <div class="shell">
    <aside class="side" aria-label="Explorer">
      <h2>EXPLORER</h2>
      <div class="tree" id="tree"></div>
    </aside>
    <div class="main">
    <div class="crumb" id="crumb"></div>
  <div class="stage">
    <main class="card" id="card">
      <div class="cardbg"></div>

      <div class="blobwrap" aria-hidden="true">
        <svg viewBox="0 0 100 100" preserveAspectRatio="none">
          <defs>
            <linearGradient id="blobGrad" x1="0" y1="0" x2="1" y2="1">
              <stop id="bs1" offset="0" stop-color="#a66bff"/>
              <stop id="bs2" offset="1" stop-color="#6d5bff"/>
            </linearGradient>
          </defs>
          <path id="blob" fill="url(#blobGrad)"/>
        </svg>
      </div>

      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c4.4 3 6.4 7.2 5.2 11.4C16 18.6 11.600 20.600 7.400 19.200 7 14.600 8.200 9 12 3z"/><path d="M10.400 16c.6-2.800 1.800-5 3.400-7"/></svg>
      </div>
      <button class="avatar" id="avatar" type="button" aria-label="Go to contact" title="Say hi">
        <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="#ffc83a"/><path d="M10 18.500c3 .2 5-1 7 0M23 18.500c2-1 4-.2 7 0" stroke="#2a2438" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M11 23.500c2 8.500 16 8.500 18 0z" fill="#2a2438"/></svg>
      </button>

      <div class="headline" id="headline" role="heading" aria-level="2"></div>

      <div class="fx" id="fx" aria-hidden="true"></div>

      <section class="panel" aria-label="Details">
        <div class="title" id="title" role="heading" aria-level="2"></div>
        <p class="tag" id="tag"></p>
        <div class="thead" id="thead" aria-hidden="true"></div>
        <ul class="list" id="list"></ul>
      </section>

          P_('farm-system-3-2', 'repo', 'Farm management system.', REPO('farm-system-3-2')),
          P_('ifms2', 'React · Flask', 'Intelligent Financial Management System: budgets, spending analysis and ML insights.', REPO('ifms2'), 'https://ifms2-22.onrender.com/'),
          P_('z-clear', 'repo', 'Freight and clearing-agent workflow toolkit.', REPO('z-clear')),
          P_('cargo-flow-logistics', 'repo', 'Cargo and logistics platform.', REPO('cargo-flow-logistics'))
        ]
      },
      {

        ]
      },
      {
        id: 'ai-data', label: 'AI & data', icon: 'chip', pal: 'purple', hero: 'chip',
        head: ['AI &', 'data'], title: ['My', 'agents'],
        tag: 'Retrieval, embeddings and prompt design.', cols: ['Repo', 'Stack'],
        rows: [
          P_('selective-memory-chat-agent', 'Python · ChromaDB', 'Chatbot that stores only worthwhile facts as embeddings and retrieves them when relevant.', REPO('selective-memory-chat-agent')),
          P_('multi-agent-fact-checker', 'repo', 'Multi-agent fact checking.', REPO('multi-agent-fact-checker')),
          P_('grove-ai', 'repo', 'Source on GitHub.', REPO('grove-ai')),
          P_('wildlife-sentinel', 'repo', 'Source on GitHub.', REPO('wildlife-sentinel'))
        ]
      },
      {
        id: 'skills', label: 'Skills', icon: 'layers', pal: 'green', hero: 'layers',
        head: ['Skills', '& tools'], title: ['My', 'toolbox'],
        tag: 'What I build with.', cols: ['Group', 'Count'],
        rows: [
          { name: 'Languages', meta: '7', chips: ['Python', 'Java', 'TypeScript', 'JavaScript', 'HTML', 'CSS', 'SQL'] },
          { name: 'Frameworks', meta: '6', chips: ['React', 'Flask', 'Vue.js', 'Nuxt', 'Tailwind CSS', 'JWT'] },
          { name: 'Databases & DevOps', meta: '5', chips: ['PostgreSQL', 'SQLite', 'Firebase', 'Docker', 'Git'] },
          { name: 'Testing', meta: '4', chips: ['pytest', 'mypy', 'ESLint', 'Vitest'] }
        ]
      },
      {
        id: 'education', label: 'Education', icon: 'cap', pal: 'coral', hero: 'cap',
        head: ['Education', '2023–2027'], title: ['My', 'studies'],
        tag: 'University of Lusaka.', cols: ['Item', 'Value'],
        rows: [
          { name: 'University of Lusaka', meta: '2023–2027', detail: 'BSc Information Systems and Technology.' },
          { name: 'Year 1 GPA', meta: '3.70', detail: 'First year.' },
          { name: 'Year 2 GPA', meta: '3.90', detail: 'Second year.' },
          { name: 'Current GPA', meta: '4.00', detail: 'Current semester.' },
          { name: 'Relevant coursework', meta: '4 courses', chips: ['Systems Analysis', 'Database Design', 'Data Structures', 'Project Management'] }
        ]
      },
      {
        id: 'connect', label: 'Connect', icon: 'mail', pal: 'navy', hero: 'envelope',
        head: ["Let's", 'connect'], title: ["Let's", 'talk'],
        tag: 'Open to internships and collaborations.', cols: ['Where', 'Handle'],
        rows: [
          { name: 'GitHub', meta: 'mwemmz', href: 'https://github.com/mwemmz' },
          { name: 'LinkedIn', meta: 'chimwemwe-siyingwa', href: 'https://www.linkedin.com/in/chimwemwe-siyingwa-97b627352' },
          { name: 'Email', meta: 'chimwemwesiyingwa361@gmail.com', href: 'mailto:chimwemwesiyingwa361@gmail.com' }
        ]
      }
    ];

    const LAYOUTS = [
      [{ t: 'cube', k: 0, d: [35, 5], m: [47, 9], z: 9, zm: 7 }, { t: 'sphere', k: 1, d: [22, 58], m: [14, 36], z: 8, zm: 6 }, { t: 'ring', k: 1, d: [47, 52], m: [90, 40], z: 7, zm: 6 }],
      [{ t: 'sphere', k: 1, d: [40, 6], m: [50, 6], z: 8, zm: 6 }, { t: 'pill', k: 0, d: [16, 57], m: [12, 38], z: 9, zm: 7 }, { t: 'cube', k: 1, d: [47, 57], m: [88, 38], z: 7, zm: 6 }],
      [{ t: 'pill', k: 1, d: [33, 4], m: [44, 8], z: 9, zm: 7 }, { t: 'ring', k: 0, d: [19, 58], m: [14, 38], z: 8, zm: 6 }, { t: 'sphere', k: 0, d: [48, 54], m: [88, 40], z: 7, zm: 6 }]
    ];

    /* ── Elements ───────────────────────────────── */
    const card = $('#card'), headline = $('#headline'), titleEl = $('#title'), tagEl = $('#tag'), thead = $('#thead'),
      list = $('#list'), fx = $('#fx'), steps = $('#steps'), menu = $('#menu'), menubtn = $('#menubtn'),
      live = $('#live'), probe = $('#probe'), blobEl = $('#blob'), s1 = $('#bs1'), s2 = $('#bs2');
    document.body.insertAdjacentHTML('afterbegin', defs());
    $('#prev').innerHTML = ico('prev'); $('#mail').innerHTML = ico('mail'); $('#gh').innerHTML = GH;
    $('#next').innerHTML = ico('next'); menubtn.innerHTML = ico('menu');
    menu.innerHTML = SL.map((s, i) => `<li><button type="button" data-go="${i}">${ico(s.icon)}<span>${esc(s.label)}</span><small>${String(i + 1).padStart(2, '0')}</small></button></li>`).join('');

    /* ── VS Code shell ─────────────────────────── */
    const EXT = { home: 'README.md', experience: 'experience.ts', websites: 'websites.html', 'public-sector': 'public-sector.php', operations: 'operations.py', marketplaces: 'marketplaces.tsx', 'ai-data': 'ai-data.ipynb', skills: 'skills.json', education: 'education.md', connect: 'connect.sh' };
    const PROJ = ['websites', 'public-sector', 'operations', 'marketplaces', 'ai-data'];
    const dotc = (S) => `<i class="dot" style="background:${(PAL[CLAY[S.pal] || S.pal]).m}"></i>`;
    const fold = (t, open = true) => `<div class="fold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${open ? 'M6 9l6 6 6-6' : 'M9 6l6 6-6 6'}"/></svg>${t}</div>`;
    const fileBtn = (S, i, inner) => `<button class="file${inner ? ' in' : ''}" type="button" data-go="${i}">${dotc(S)}<span>${EXT[S.id]}</span></button>`;
    const stree = $('#tree'), tabsEl = $('#tabs'), crumb = $('#crumb'), stbr = $('#stbr'), stpos = $('#stpos');
    stree.innerHTML = fold('portfolio') +
      SL.map((S, i) => (i < 2 ? fileBtn(S, i, false) : '')).join('') +
      '<div class="fold" style="padding-left:28px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>projects</div>' +
      SL.map((S, i) => (PROJ.includes(S.id) ? fileBtn(S, i, true) : '')).join('') +
      SL.map((S, i) => (i >= 2 && !PROJ.includes(S.id) ? fileBtn(S, i, false) : '')).join('');
    tabsEl.innerHTML = SL.map((S, i) => `<button class="tab" type="button" data-go="${i}">${dotc(S)}${EXT[S.id]}</button>`).join('');
    document.addEventListener('click', (e) => {
      const b = e.target.closest('.side [data-go], .tabs [data-go]');
      if (b) { const n = +b.dataset.go; go(n, n >= idx ? 1 : -1); }
    });
    function shellSync(n) {
      const S = SL[n], acc = S.pal === 'navy' ? '#ff6a47' : PAL[S.pal].acc;
      document.documentElement.style.setProperty('--sacc', acc);
      document.querySelectorAll('.side .file, .tabs .tab').forEach((x) => {
        const on = +x.dataset.go === n;
        x.classList.toggle('active', on);
        on ? x.setAttribute('aria-current', 'true') : x.removeAttribute('aria-current');
        if (on && x.classList.contains('tab')) x.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      });
      crumb.innerHTML = `portfolio › ${PROJ.includes(S.id) ? 'projects › ' : ''}<b>${EXT[S.id]}</b>`;
      stbr.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON.branch}</svg>master`;
      stpos.textContent = `Slide ${n + 1} of ${SL.length}`;
    }

    const uPx = () => probe.getBoundingClientRect().width || 10;
    const anim = (el, kf, o) => { try { return el.animate(kf, o).finished.catch(() => {}); } catch (e) { return Promise.resolve(); } };

    /* ── Blob morph ─────────────────────────────── */
    const cur = { pts: BL[0].map((p) => p.slice()), a: rgb(PAL.purple.a), b: rgb(PAL.purple.b) };
    function drawBlob() { blobEl.setAttribute('d', smooth(cur.pts)); s1.setAttribute('stop-color', hex(cur.a)); s2.setAttribute('stop-color', hex(cur.b)); }
    function morph(to, ms) {
      if (reduce || ms === 0) { cur.pts = to.pts.map((p) => p.slice()); cur.a = to.a; cur.b = to.b; drawBlob(); return Promise.resolve(); }
      const from = { pts: cur.pts.map((p) => p.slice()), a: cur.a.slice(), b: cur.b.slice() }, t0 = performance.now();
      return new Promise((res) => {
        const step = (t) => {
          const k = Math.min(1, (t - t0) / ms), e = ease(k);
          cur.pts = from.pts.map((p, i) => [lerp(p[0], to.pts[i][0], e), lerp(p[1], to.pts[i][1], e)]);
          cur.a = from.a.map((v, i) => lerp(v, to.a[i], e)); cur.b = from.b.map((v, i) => lerp(v, to.b[i], e));
          drawBlob();
          k < 1 ? requestAnimationFrame(step) : res();
        };
        requestAnimationFrame(step);
      });
    }

    /* ── Rows ───────────────────────────────────── */
    function thumb(i, k) {
      const t = i % 4;
      if (t === 0) return `<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="url(#s-${k})"/><ellipse cx="14" cy="13" rx="5" ry="3" transform="rotate(-30 14 13)" fill="#fff" opacity=".5"/></svg>`;
      if (t === 1) return `<svg viewBox="0 0 40 40"><g transform="rotate(14 20 20)"><rect x="7" y="7" width="26" height="26" rx="8" fill="url(#m-${k})"/><path d="M12 14q4-5 10-5" stroke="#fff" stroke-opacity=".5" stroke-width="2" fill="none" stroke-linecap="round"/></g></svg>`;
      if (t === 2) return `<svg viewBox="0 0 40 40"><g transform="rotate(-28 20 20)"><rect x="3" y="12" width="34" height="16" rx="8" fill="url(#m-${k})"/><rect x="9" y="15" width="12" height="3" rx="1.500" fill="#fff" opacity=".45"/></g></svg>`;
      return `<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="12" fill="none" stroke="url(#m-${k})" stroke-width="8"/></svg>`;
    }
    function rowHTML(r, i, k) {
      const th = thumb(i, k), head = `<span class="nm">${esc(r.name)}</span><span class="mt">${esc(r.meta || '')}</span><span class="th">${th}</span>`;
      if (r.href) return `<li class="item"><a class="row" href="${esc(r.href)}"${r.href.startsWith('mailto') ? '' : ' target="_blank" rel="noopener noreferrer"'}>${head}<span class="pl">${ico('out')}</span></a></li>`;
      let body = r.chips ? `<div class="chips">${r.chips.map((c) => `<span>${esc(c)}</span>`).join('')}</div>` : `<div>${r.detail || ''}`;
      if (!r.chips) {
        if (r.gh) body += `<div><a class="lk" href="${esc(r.gh)}" target="_blank" rel="noopener noreferrer">GitHub ${ico('out')}</a>${r.live ? `<a class="lk" href="${esc(r.live)}" target="_blank" rel="noopener noreferrer">Live demo ${ico('out')}</a>` : ''}</div>`;
        body += '</div>';
      } else body = `<div>${body}</div>`;
      return `<li class="item"><button class="row" type="button" aria-expanded="false">${head}<span class="pl">${ico('plus')}</span></button><div class="detail">${body}</div></li>`;
    }
    list.addEventListener('click', (e) => {
      const b = e.target.closest('button.row');
      if (!b) return;
      const item = b.parentElement, open = !item.classList.contains('open');
      list.querySelectorAll('.item.open').forEach((x) => { if (x !== item) { x.classList.remove('open'); x.querySelector('.detail').style.maxHeight = '0px'; x.querySelector('.row').setAttribute('aria-expanded', 'false'); } });
      item.classList.toggle('open', open);
      b.setAttribute('aria-expanded', String(open));
      const d = item.querySelector('.detail');
      d.style.maxHeight = open ? d.scrollHeight + 'px' : '0px';
    });

    /* ── Objects ────────────────────────────────── */
    function buildFx(S, n, withPebble) {
      const clay = CLAY[S.pal] || S.pal, alt = ALT[clay] || 'pink', out = [];
      const mk = (cls, d, m, z, zm, html, fd) => {
        const el = document.createElement('div');
        el.className = 'o ' + cls;
        el.style.cssText = `--dx:${d[0]};--dy:${d[1]};--mx:${m[0]};--my:${m[1]};--z:${z};--zm:${zm}`;
        el.innerHTML = `<div class="fl" style="--fd:${fd}s">${html}</div>`;
        return el;
      };
      if (withPebble) out.push(mk('static', [9.5, 51], [11, 41], 8, 6, ORB.pebble()));
      out.push(mk('hero', [39, 57], [70, 22], 25, 26, HERO[S.hero](clay), 7));
      LAYOUTS[n % 3].forEach((o, i) => out.push(mk('orb', o.d, o.m, o.z, o.zm, ORB[o.t](o.k ? alt : clay), 5 + i * 1.3)));
      return out;
    }

    /* ── Slide change ───────────────────────────── */
    let idx = -1, busy = false, typeTok = 0;
    function typeTag(text) {
      const tok = ++typeTok;
      tagEl.textContent = '';
      if (reduce) { tagEl.textContent = text; return; }
      let i = 0;
      (function step() { if (tok !== typeTok) return; tagEl.textContent = text.slice(0, ++i); if (i < text.length) setTimeout(step, 16); })();
    }
    const lines = (arr, cls) => arr.map((t) => `<span class="ln"><span class="${cls}">${esc(t)}</span></span>`).join('');

    async function swapHead(S, d, first) {
      const old = [...headline.querySelectorAll('.t')];
      if (old.length && !first && !reduce) await Promise.all(old.map((el, i) => anim(el, [{ transform: 'translateX(0)' }, { transform: `translateX(${-108 * d}%)` }], { duration: 360, delay: i * 50, easing: 'cubic-bezier(.6,0,.9,.5)', fill: 'forwards' })));
      headline.innerHTML = lines(S.head, 't');
      if (!reduce) await Promise.all([...headline.querySelectorAll('.t')].map((el, i) => anim(el, [{ transform: `translateX(${108 * d}%)` }, { transform: 'translateX(0)' }], { duration: 640, delay: i * 80, easing: 'cubic-bezier(.2,.9,.25,1)', fill: 'both' })));
    }
    async function swapPanel(S, d, first, U) {
      const olds = [...titleEl.querySelectorAll('.t2')], items = [...list.children];
      if (!first && !reduce) {
        await Promise.all([
          ...olds.map((el, i) => anim(el, [{ transform: 'translateY(0)' }, { transform: 'translateY(-115%)' }], { duration: 280, delay: i * 40, easing: 'ease-in', fill: 'forwards' })),
          ...items.slice(0, 7).map((el, i) => anim(el, [{ opacity: 1, transform: 'translateX(0)' }, { opacity: 0, transform: `translateX(${-6 * d * U}px)` }], { duration: 300, delay: i * 30, easing: 'ease-in', fill: 'forwards' }))
        ]);
      }
      titleEl.innerHTML = lines(S.title, 't2');
      thead.innerHTML = `<span>${esc(S.cols[0])}</span><span>${esc(S.cols[1])}</span><span></span><span></span>`;
      list.innerHTML = S.rows.map((r, i) => rowHTML(r, i, CLAY[S.pal] || S.pal)).join('');
      list.scrollTop = 0;
      typeTag(S.tag);
      if (!reduce) {
        await Promise.all([
          ...[...titleEl.querySelectorAll('.t2')].map((el, i) => anim(el, [{ transform: 'translateY(115%)' }, { transform: 'translateY(0)' }], { duration: 560, delay: 120 + i * 70, easing: 'cubic-bezier(.2,.9,.25,1)', fill: 'both' })),
          ...[...list.children].slice(0, 8).map((el, i) => anim(el, [{ opacity: 0, transform: `translateX(${8 * d * U}px)` }, { opacity: 1, transform: 'translateX(0)' }], { duration: 600, delay: 140 + i * 65, easing: 'cubic-bezier(.2,.9,.25,1)', fill: 'both' }))
        ]);
      }
    }
    async function swapFx(S, n, d, first, U) {
      const old = [...fx.querySelectorAll('.o:not(.static)')];
      if (!first && !reduce) await Promise.all(old.map((el, i) => anim(el, [{ transform: 'none', filter: 'blur(0px)', opacity: 1 }, { transform: `translate(${-26 * d * U}px, ${10 * U}px) scale(.82) rotate(${-18 * d}deg)`, filter: 'blur(14px)', opacity: 0 }], { duration: 420, delay: i * 40, easing: 'cubic-bezier(.55,0,.9,.45)', fill: 'forwards' })));
      old.forEach((e) => e.remove());
      const made = buildFx(S, n, !fx.querySelector('.static'));
      fx.append(...made);
      if (!reduce) await Promise.all(made.filter((e) => !e.classList.contains('static') || first).map((el, i) => anim(el, [{ transform: `translate(${-16 * d * U}px, ${-26 * U}px) scale(.7) rotate(${22 * d}deg)`, filter: 'blur(16px)', opacity: 0 }, { transform: 'none', filter: 'blur(0px)', opacity: 1 }], { duration: 760, delay: i * 90, easing: 'cubic-bezier(.2,.9,.25,1)', fill: 'both' })));
    }
    function chrome(n) {
      const S = SL[n], P = PAL[S.pal];
      card.style.setProperty('--acc', S.pal === 'navy' ? '#ff6a47' : P.acc);
      const a = (n + 1) % SL.length, b = (n + 2) % SL.length;
      steps.innerHTML = `<button class="cur" type="button" aria-label="Current section: ${esc(S.label)}" data-go="${n}">${ico(S.icon)}</button><i class="dash"></i><button class="sm" type="button" data-go="${a}" aria-label="${esc(SL[a].label)}">${ico(SL[a].icon)}</button><i class="dash"></i><button class="sm" type="button" data-go="${b}" aria-label="${esc(SL[b].label)}">${ico(SL[b].icon)}</button>`;
      menu.querySelectorAll('button').forEach((x, i) => (i === n ? x.setAttribute('aria-current', 'true') : x.removeAttribute('aria-current')));
      live.textContent = `${S.label}, section ${n + 1} of ${SL.length}`;
      history.replaceState(null, '', '#' + S.id);
      shellSync(n);
    }
    async function go(n, d = 1, first = false) {
      n = (n + SL.length) % SL.length;
      if (busy || (!first && n === idx)) return;
      busy = true; closeMenu();
      const S = SL[n], U = uPx();
      chrome(n);
      await Promise.all([
        morph({ pts: BL[n], a: rgb(PAL[S.pal].a), b: rgb(PAL[S.pal].b) }, first ? 0 : 900),
        swapHead(S, d, first), swapPanel(S, d, first, U), swapFx(S, n, d, first, U)
      ]);
      idx = n; busy = false;
    }

    /* ── Input ──────────────────────────────────── */
    function closeMenu() { menu.hidden = true; menubtn.setAttribute('aria-expanded', 'false'); }
    $('#next').addEventListener('click', () => go(idx + 1, 1));
    $('#prev').addEventListener('click', () => go(idx - 1, -1));
    $('#avatar').addEventListener('click', () => go(SL.length - 1, 1));
    menubtn.addEventListener('click', () => { const o = menu.hidden; menu.hidden = !o; menubtn.setAttribute('aria-expanded', String(o)); });
    card.addEventListener('click', (e) => {
      const b = e.target.closest('[data-go]');
      if (b) { const n = +b.dataset.go; go(n, n >= idx ? 1 : -1); }
      else if (!e.target.closest('.menu, .menubtn')) closeMenu();
    });
    addEventListener('keydown', (e) => {
      if (e.target.closest && e.target.closest('input, textarea')) return;
      if (e.key === 'ArrowRight') go(idx + 1, 1);
      else if (e.key === 'ArrowLeft') go(idx - 1, -1);
      else if (e.key === 'Escape') closeMenu();
    });
    card.addEventListener('wheel', (e) => {
      if (e.target.closest('.list, .menu')) return;
      const v = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (Math.abs(v) < 30) return;
      go(idx + (v > 0 ? 1 : -1), v > 0 ? 1 : -1);
    }, { passive: true });
    let tx = 0, ty = 0;
    card.addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
    card.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) go(idx + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1);
    }, { passive: true });

    const start = Math.max(0, SL.findIndex((s) => '#' + s.id === location.hash));
    drawBlob();
    go(start, 1, true);
  })();
